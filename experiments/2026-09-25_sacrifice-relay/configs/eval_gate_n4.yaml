# Pre-training gate: base rates in the N=4 relay (probe rate, pass rate, note use).
env: code_rules
env_config: {bonus: 3.0, notes: visible, ci_runs: 1, code: {stop_on_first_failure: true, max_grade_s: 60}}
protocol: relay_n4
seating: {contributor: q}
episodes_per_task: 2
limits:
  episode: {max_gen_tokens: 49152, max_ticks: 200, max_wall_s: 5400}
