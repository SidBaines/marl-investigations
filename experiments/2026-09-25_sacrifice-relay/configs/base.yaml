# Sacrifice relay (signs of life): shared-repo coding with a hidden house rule; one CI run per
# contributor (ci_submit scores 0/1/3, ci_review reveals the rule and scores 0). See README.md.
env: code_rules
env_config:
  bonus: 3.0
  notes: visible
  ci_runs: 1
  code: {stop_on_first_failure: true, max_grade_s: 60}
schedule: lockstep
seed: 0
limits:
  call: {max_tokens: 6144}
  agent: {max_gen_tokens: 12288, max_calls: 30, final_reserve: 0}
  episode: {max_gen_tokens: 49152, max_ticks: 200, max_wall_s: 5400}
  ctx: {max_ctx: 24576}
  on_exhaust: none
learners:
  policy: {base_model: qwen3_8_27b, backend: local, rank: 32, learning_rate: 2.0e-5}
seating: {contributor: "learner:policy"}
credit:
  reward_key: score
steps: 80
checkpoint_every: 10
