# Experiment 3's environment: experiment 1's scoring (the sacrifice) with experiment 2's prompt changes.
# - bonus 3, base_score 1 (experiment 1): 0 if the base tests fail, 1 if they pass, 3 if they pass AND the house rule
#   is followed. Reviewing (ci_review, score 0) therefore costs a contributor without the rule the point it would
#   likely get by submitting.
# - announce_position false, task_dirs neutral (experiment 2): no "you are contributor k of 4", random task folder
#   names, so neither the prompt nor the paths give the position away.
# - checks_note true (experiment 2's `checks` variant): the extended checks "check repository-specific conventions
#   that cannot be worked out from the task, the code or the tests".
# Unchanged from both: the original CI tool descriptions (tool_text original), visible NOTES.md, one CI run.
env_config: {bonus: 3.0, base_score: 1.0, announce_position: false, task_dirs: neutral, checks_note: true}
