# Live dashboard for experiment 3 (marli dashboard; every key is a runtime setting). `./run.sh dashboard` serves it
# on the pod; anywhere else (dev box, laptop with synced runs):
#   uv run --no-sync marli dashboard <this file> "roots=[<exp3>/out]" serve_port=8765 --out runs/dashboard
# The same charts as ../review_dashboard.yaml. Under 0/1/3 scoring a contributor scores 1 for passing the base tests
# and 3 for passing them with the rule followed; "submitted with the rule followed" and "submitted passing the base
# tests" are counted only on ci_submit (0 otherwise), like score. Per-position rates are out of all contributors at
# that position; ../exp2_mandatory_rule/check.py gives the conditional rates.
title: Sacrifice relay, experiment 3 (0/1/3 scoring, Qwen3.6-35B-A3B)
grouped:
  ran_ci: Reached CI (either mode)
  probed: Chose review
  submitted: Chose submit
  score: "Score (0, 1 or 3). The average line is the team score"
  rule_known_at_start: Started knowing the rule
  rule_met: Submitted with the rule followed
  base_pass: Submitted passing the base tests
agent_labels: {contrib0: 1st, contrib1: 2nd, contrib2: 3rd, contrib3: 4th}
smooth_steps: 5
# Split by whether the contributor started knowing the rule, for contributors 2-4 (the 1st never does).
split_by: rule_known_at_start
split_labels: [Started knowing the rule, Did not]
split_agents: [contrib1, contrib2, contrib3]
