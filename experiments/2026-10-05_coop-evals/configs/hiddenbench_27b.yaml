  - {label: team_s59, results: experiments/2026-10-05_coop-evals/out/hiddenbench_27b/team_s59, seats: [27b_team_s59, 27b_team_s59, 27b_team_s59, 27b_team_s59], focal: 27b_team_s59}
  - {label: indiv_s29, results: experiments/2026-10-05_coop-evals/out/hiddenbench_27b/indiv_s29, seats: [27b_indiv_s29, 27b_indiv_s29, 27b_indiv_s29, 27b_indiv_s29], focal: 27b_indiv_s29}
  - {label: exp21_s29, results: experiments/2026-10-05_coop-evals/out/hiddenbench_27b/exp21_s29, seats: [27b_exp21_s29, 27b_exp21_s29, 27b_exp21_s29, 27b_exp21_s29], focal: 27b_exp21_s29}
