# Local learner (PEFT multi-LoRA + vLLM, one H100, co-located) RL on POLARIS math.
# Coordinator protocol with per-role LoRA: learner `coord` (coordinator) and `work` (workers).
env: math
env_config: {python_tool: false}
protocol: coordinator_default
schedule: lockstep
seed: 0
limits:
  call: {max_tokens: 3072}
  agent: {max_gen_tokens: 4096, final_reserve: 256}
  worker: {max_gen_tokens: 2048, final_reserve: 256, max_calls: 12}
  episode: {max_gen_tokens: 8192, max_ticks: 24, max_wall_s: 1800}
  spawn: {max_per_call: 2, max_total: 2}
  ctx: {max_ctx: 16384}
learners:
  coord: {base_model: qwen3_5_4b, backend: local, rank: 32, learning_rate: 1.0e-5}
  work: {base_model: qwen3_5_4b, backend: local, rank: 32, learning_rate: 1.0e-5}
seating: {coordinator: "learner:coord", worker: "learner:work"}
