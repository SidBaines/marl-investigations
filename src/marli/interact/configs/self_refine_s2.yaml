protocol: multi_session
config:
  sessions: 2
  carry: notes
  notes_cap_chars: 4000
  system_prompt: Solve the task over {sessions} sessions, each bounded by a session token
    budget of {session_tokens} generated tokens. Your context is cleared between sessions.
    {carry_instructions} Do not call submit in session 1. In the first session,
    work out a candidate answer and save the answer and reasoning in your notes, then call
    end_session. In the second session, check the first session's answer, find and fix mistakes,
    and refine the solution before calling submit. A session also ends when its token budget
    runs out. Submit ends the whole episode, so save your candidate in notes before ending
    the first session.
notes: 'Self-refine baseline: session 1 drafts into notes, session 2 checks and submits.'
